name: Test

on:
  push:
    branches:
      - master
      - "develop/*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Install shell prerequisite
        if: github.event_name != 'push'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Verify runtime and real PTY prerequisites
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          node -p 'JSON.stringify({node:process.version,uv:process.versions.uv,arch:process.arch})'
          npm --version
          test "$(id -u)" -ne 0
          test -x /bin/sh && test -x /bin/bash && test -x /bin/zsh
          PATH=/usr/bin:/bin python3 --version
          PATH=/usr/bin:/bin python3 -c 'import os,pty; master,slave=pty.openpty(); os.close(slave); os.close(master)'
      - run: npm ci
      - run: npm run build
      - name: Unit tests with diagnostics
        shell: bash
        run: |
          set -euo pipefail
          npm run test:unit 2>&1 | tee unit-test.log
          if grep -Eq 'skipped [1-9][0-9]*' unit-test.log; then
            echo 'Unit tests cannot pass with skipped tests'
            exit 1
          fi
      - name: Integration tests with diagnostics
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          npm run test:integration 2>&1 | tee integration-test.log
          if grep -Eq 'skipped [1-9][0-9]*' integration-test.log; then
            echo 'Integration tests cannot pass with skipped tests'
            exit 1
          fi
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failure
          path: |
            unit-test.log
            integration-test.log
          retention-days: 7
